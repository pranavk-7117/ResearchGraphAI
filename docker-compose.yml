services:
  test-db:
    image: pgvector/pgvector:pg16
    container_name: researchgraph_test_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: researchgraph_test
    ports:
      - "5433:5432"
    volumes:
      - pgdata_test:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d researchgraph_test"]
      interval: 3s
      timeout: 3s
      retries: 5

volumes:
  pgdata_test:
