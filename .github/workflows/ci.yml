name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: researchgraph_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio

      - name: Run Alembic migrations on test DB
        env:
          DATABASE_URL: postgresql+psycopg2://postgres:postgrespassword@localhost:5432/researchgraph_test
          TEST_DATABASE_URL: postgresql+psycopg2://postgres:postgrespassword@localhost:5432/researchgraph_test
        run: |
          cd backend
          alembic upgrade head

      - name: Run backend tests
        env:
          DATABASE_URL: postgresql+psycopg2://postgres:postgrespassword@localhost:5432/researchgraph_test
          TEST_DATABASE_URL: postgresql+psycopg2://postgres:postgrespassword@localhost:5432/researchgraph_test
          ALLOW_LIVE_TESTS: "1"
        run: |
          cd backend
          python -m pytest tests/ -v

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install and build frontend
        run: |
          cd frontend
          npm ci
          npm run build
